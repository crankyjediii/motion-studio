<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Motion Studio</title>
  <desc id="desc">A dark editing desk with coral motion studies, three frame shapes, and a short film timeline.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F5F0E7" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="screen" x1="788" y1="110" x2="1336" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292C35"/>
      <stop offset="1" stop-color="#1A1C24"/>
    </linearGradient>
    <linearGradient id="coral" x1="1090" y1="165" x2="1260" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB398"/>
      <stop offset="1" stop-color="#F66B4F"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1440" height="550" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1440" height="550" fill="#13151C"/>
    <rect width="1440" height="550" fill="url(#grid)"/>
    <path d="M720 48V410" stroke="#353740" stroke-dasharray="3 9"/>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="3">
      <circle cx="64" cy="65" r="5" fill="#FF896D"/>
      <text x="84" y="71" fill="#CBC7C1">A CLAUDE CODE PLUGIN</text>
      <text x="1360" y="71" fill="#8D8F9D" text-anchor="end">LOCAL RENDER / 30 FPS</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="134" font-weight="750" letter-spacing="-8">
      <text x="52" y="218" fill="#F7F2E9">Motion</text>
      <text x="52" y="347" fill="#F7F2E9">Studio<tspan fill="#FF896D">.</tspan></text>
    </g>
    <text x="60" y="393" fill="#B8B8C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" letter-spacing=".2">Short product films, rendered on your machine.</text>

    <rect x="778" y="108" width="586" height="294" rx="12" fill="url(#screen)" stroke="#444651"/>
    <path d="M800 146V130H816 M1326 130H1342V146 M800 364V380H816 M1326 380H1342V364" stroke="#6B6D79" stroke-width="2"/>
    <g stroke="#F7F2E9" stroke-width="1.5">
      <rect x="828" y="182" width="224" height="126" rx="6" stroke-opacity=".3"/>
      <rect x="943" y="154" width="112" height="199" rx="6" stroke-opacity=".45"/>
      <rect x="1044" y="174" width="162" height="162" rx="6" stroke-opacity=".7"/>
    </g>
    <path d="M884 276C985 276 998 212 1130 245" stroke="#FF896D" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="884" cy="276" r="24" fill="#FF896D" fill-opacity=".12"/>
    <circle cx="969" cy="248" r="34" fill="#FF896D" fill-opacity=".24"/>
    <circle cx="1049" cy="244" r="44" fill="#FF896D" fill-opacity=".45"/>
    <rect x="1095" y="191" width="114" height="114" rx="22" transform="rotate(12 1152 248)" fill="url(#coral)"/>
    <path d="M1142 229L1172 249L1142 268V229Z" fill="#252129"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">
      <text x="818" y="365" fill="#B4B4BF">16:9</text>
      <text x="970" y="365" fill="#B4B4BF">9:16</text>
      <text x="1147" y="365" fill="#B4B4BF">1:1</text>
      <text x="1323" y="365" fill="#FFB298" text-anchor="end">FRAME 024</text>
    </g>

    <path d="M60 430H1380" stroke="#363842"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#A8A9B4">
      <text x="60" y="455">00:00</text>
      <text x="1380" y="455" text-anchor="end">00:15</text>
    </g>
    <rect x="60" y="470" width="220" height="38" rx="5" fill="#F58B72"/>
    <rect x="288" y="470" width="438" height="38" rx="5" fill="#DC6B55"/>
    <rect x="734" y="470" width="360" height="38" rx="5" fill="#AD5144"/>
    <rect x="1102" y="470" width="278" height="38" rx="5" fill="#743F3D"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">
      <text x="78" y="494" fill="#251B22">01 / HOOK</text>
      <text x="306" y="494" fill="#251B22">02 / PRODUCT</text>
      <text x="752" y="494" fill="#FFF2EA">03 / PAYOFF</text>
      <text x="1120" y="494" fill="#FFF2EA">04 / END CARD</text>
    </g>
    <path d="M496 461V518" stroke="#FFE5D6" stroke-width="2"/>
    <path d="M490 456H502L496 463L490 456Z" fill="#FFE5D6"/>
  </g>
</svg>
